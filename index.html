
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;

            /* Imagem de fundo */
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.4),
                    rgba(0, 0, 0, 0.6)
                ),
                url("https://wallissong063.github.io/Mydrinks/pagina_01.png");

            background-size: cover;
            background-position: center;
        }

        /* Botão inferior */
        .botao {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-40%);

            padding: 15px 45px;
            border: 1px solid white;
            border-radius: 30px;

            background: rgba(255, 255, 255, 0.15);
            color: white;

            font-size: 17px;
            text-decoration: none;

            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .botao:hover {
            background: white;
            color: black;
            transform: translateX(-50%) scale(1.05);
        }

    </style>
</head>

<body>

    <div class="container">

        <a href="https://wallissong063.github.io/Mydrinks/pagina_01.html" class="botao">
            Continuar
        </a>

    </div>

</body>
</html>
